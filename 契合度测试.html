<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>契合度测试</title>

  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text); background:linear-gradient(160deg,#f7f1ea,#eef3f7);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.7;
  }
  .card { background:#fff; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.06); padding:40px 32px; max-width:420px; width:100%; text-align:center; }
  .emoji { font-size:40px; margin-bottom:10px; }
  h1 { font-size:22px; margin-bottom:14px; }
  p { color:var(--muted); font-size:15px; }
  a { display:inline-block; margin-top:20px; color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">💗</div>
  <h1>契合度测试</h1>
  <p>测试内容准备中……<br>题目和选项定好后，就会放到这里。</p>
